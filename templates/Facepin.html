<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facepin Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url('/static/bg.jpg') no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); 
        backdrop-filter: blur(2px);
        z-index: 0;
    }

    .container {
        text-align: center;
        background-color: #fefefe;
        border: 3px solid #4a1f69;
        border-radius: 20px;
        padding: 30px;
        position: relative;
        font-size: 15px;
        width:350px;
        left:37%;
        top:20%;
    }

    .otp-form {
        margin-bottom: 20px;
    }

    .otp-form input[type="text"] {
        padding: 10px;
        width: 40px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        margin-right: 5px;
        text-align: center;
    }

    .otp-form button {
        padding: 10px 20px;
        background-color: #9b2c10;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    .otp-form button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }

    .otp-form button:hover {
        background-color: #43337d;
    }

    .logo {
        width: 70px;
        position: absolute;
        top: 10pt;
        left: 0.8pc;
        padding-right: 10pt;
    }

    .logo_1 {
        width: 120px;
        position: absolute;
        top: 10;
        right: 0;
        padding-right: 10pt; 
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    form {
        width: 100%;
        max-width: 400px;
        padding: 20px;
    }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
    <div class="header">
        <img src="/static/Hsbc_icon.png" alt="HSBC Logo" class="logo">
        <img src="/static/icon.png" alt="Facepay Logo" class="logo_1">
        <h2 style="color: rgb(74, 39, 98); margin-top:50px; font-size: 3vw;">F-PIN</h2>
        <p>Please enter your FPIN </p>
    </div>
    
    
    <form class="otp-form" id="otpForm">
        <input type="text" maxlength="1" id="digit1" name="digit1" placeholder="" required>
        <input type="text" maxlength="1" id="digit2" name="digit2" placeholder="" required>
        <input type="text" maxlength="1" id="digit3" name="digit3" placeholder="" required>
        <input type="text" maxlength="1" id="digit4" name="digit4" placeholder="" required>
        <input type="text" maxlength="1" id="digit5" name="digit5" placeholder="" required>
        <!-- <input type="text" maxlength="1" id="digit6" name="digit6" placeholder="D6" required><br><br> -->
        <br>
        <br>
        <button type="submit" id="submitBtn">Submit</button><br><br>
        <div id="message"></div> <!-- Container for displaying messages -->
    </form>
</div>

<script>
    // Form submission handler
    document.getElementById('otpForm').addEventListener('submit', function(event) {
        event.preventDefault();
        // Handle form submission (e.g., validate FPIN)
        // Additional logic goes here
        console.log("innn");
        window.location.href = '/final'; // Redirect to final.html
    });
</script>
</body>
</html>
