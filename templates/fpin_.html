        /* Add logos with their respective colors and designs */

            background-image: url("/static/visa.png") ;

            background-image: url("/static/icon.png");

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url('/static/bg.jpg') no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Adjust the alpha channel for desired opacity */
        backdrop-filter: blur(0px); /* Adjust the blur radius */
        z-index: 0;
    }
    .header {
        display: block    ;
        align-items: center;
        justify-content: center;
        margin-bottom: 0px; 
        width:320px;
    }

    .container {
        text-align: center;
        border: 3px solid #ccc; /* Border properties */
        border-radius: 20px; /* Rounded border */
        padding: 30px; /* Padding inside the border */
        position: relative; /* Necessary for absolute positioning of the image */
        font-size: 15px;
        left :75vh;
        top : 10vh;
        width:300px;
        height:60vh;
    }

    .payment-options {
        margin-bottom: 20px;
    }

    .payment-options label {
        display: block;
        margin-bottom: 10px;
    }

    .payment-options input[type="radio"] {
        display: none;
    }

    .payment-options label.btn {
        padding: 10px 20px;
        background-color:  #9b1d14;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .payment-options label.btn:hover {
        background-color: #542399;
    }

    /* .payment-options input[type="radio"]:checked + label.btn {
        background-color: #0056b3;
    } */
    #topRightImage {
        position: absolute;
        top: 10px; /* Adjust as needed */
        right: 10px; /* Adjust as needed */
        width: 250px; /* Adjust width as needed */
        height: auto; /* Maintain aspect ratio */
    }
    .logo {
        width: 100px; /* Adjust size as needed */
        margin-right: 10px; /* Adjust spacing between logo and heading */
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 60%;
        max-width: 400px; /* Max width of the modal */
        position: relative;
    }

    .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: #f00;
    }

    .modal-content button {
        margin: 5px;
        padding: 10px 20px;
        background-color: #9b1d14;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .modal-content button:hover {
        background-color: #3a3073;
    }
</style>
</head>
<body>
<div class="overlay"></div>
<!-- <img src="/static/icon.png" alt="Image" id="topRightImage"> -->
<div class="container">
    <div class="header">
        <img src="/static/Hsbc_icon.png" alt="HSBC Logo" class="logo">
        <h1 class="heading" style="color:white">Payment Mode</h1>
    </div> 
    <form class="payment-options">

        <input type="radio" id="facePay" name="paymentMethod" value="facePay">
        <label class="btn" for="facePay" onclick="openModal()">FacePay</label><br>

        <input type="radio" id="creditDebit" name="paymentMethod" value="creditDebit">
        <label class="btn" for="creditDebit">Pay through Credit/Debit</label><br>   
        
        
        <!-- <label class="btn" for="facePay" onclick="openModal()"><img src="/static/icon.png" alt="FacePay"></label><br>
         -->
        <input type="radio" id="upi" name="paymentMethod" value="upi">
        <label class="btn" for="upi">UPI Payment</label><br>

        <input type="radio" id="others" name="paymentMethod" value="others">
        <label class="btn" for="others">Paypal</label>
    </form>
</div>

<!-- Modal -->
<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <p>How would you like to authenticate your payment?</p>
        <button onclick="fpinClicked()">FPIN</button>
        <button onclick="otpClicked()">OTP</button>       
    </div>
</div>

    function openModal() {
        var modal = document.getElementById("myModal");
        modal.style.display = "block";
    }

    // Function to close the modal
    function closeModal() {
        var modal = document.getElementById("myModal");
        modal.style.display = "none";
    }

    // Function to handle FPIN button click
    function fpinClicked() {
        alert("FPIN clicked");
        captureFPIN();
        closeModal();

        window.location.href = '/Facepin';

    // Function to handle OTP button click

</html>
