<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('/static/card.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Adjust the alpha channel for desired opacity */
            backdrop-filter: blur(2px); /* Adjust the blur radius */
            z-index: 0;
        }
        .container {
            text-align: center;
            background-color: #fefefe;
            /* border: 3px solid #e7dbbb; */
            border: 3px solid #4a1f69; /* Border properties */
            border-radius: 20px; /* Rounded border */
            padding: 30px; /* Padding inside the border */
            position: relative; /* Necessary for absolute positioning of the image */
            font-size: 15px;
            width: 350px;
            left: 37%;
            top: 20%
        }

        .logo {
            width: 70px; /* Adjust size as needed */
            position: absolute;
            top: 10pt;
            left: 0.8pc;
            padding-right: 10pt;
        }

        .logo_1 {
            width: 120px; /* Adjust size as needed */
            position: absolute;
            top: 10;
            right: 0;
            padding-right: 10pt;
        }  
        h1 {
            color: #333;
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <img src="/static/Hsbc_icon.png" alt="HSBC Logo" class="logo">
        <img src="/static/icon.png" alt="Facepay Logo" class="logo_1">
        <h1 style="color: rgb(74, 39, 98);margin-top:50px;font-size: 3vw;">Your transaction is Successful</h1>
        <h2>Thank You for using HSBC FacePay</h2>
    </div>
</body>
</html>
